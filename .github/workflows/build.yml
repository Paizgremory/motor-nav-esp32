name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ESP32
            fqbn: esp32:esp32:esp32
          - name: ESP32-C3
            fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: latest

      - name: Configure ESP32 board core & libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Arduino GFX Library" "NimBLE-Arduino"

      - name: Compile sketch
        run: |
          SKETCH=$(find . -maxdepth 2 -name "*.ino" | head -n 1)
          echo "Compiling $SKETCH for ${{ matrix.fqbn }}"
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --output-dir "build/${{ matrix.name }}" "$SKETCH"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: build/${{ matrix.name }}/*.bin
